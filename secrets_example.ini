[secrets]
build_flags =
    ; Имя узла. У КАЖДОГО устройства должно быть СВОЁ: у сенсорных плат env
    ; heltec_v4_3_sensors переопределяет -DDEVICE_NAME (иначе MQTT-бот
    ; отбрасывает сообщения как «от себя»), и оно = имя устройства в HA.
    -DDEVICE_NAME='"Device_NAME"'
    -DWIFI_SSID='"WIFI_SSID"'
    -DWIFI_PASS='"WIFI_PASSWORD"'
    -DMQTT_BROKER='"MQTT_BROKER"'
    -DMQTT_PORT=1883
    -DMQTT_USER='"MQTT_USERNAME"'
    -DMQTT_PASS='"MQTT_PASSWORD"'
    ; ===== Каналы (задаются ТОЛЬКО здесь, из HA не настраиваются) =====
    ; Прошивка при старте добавляет канал из этих флагов (NVS не используется).
    ; Приватный канал: имя + PSK base64 (16 байт) или пусто = автоключ SHA256(name)
    -DPRIVATE_CHANNEL_NAME='"control channel"'
    -DPRIVATE_CHANNEL_KEY='"controlPSKbase64=="'
    ; Канал сенсоров: по нему сенсоры шлют показания (публикуются в MQTT как
    ; отдельное устройство HA по имени отправителя) и по нему же бот передаёт
    ; сенсорам обновление прошивки (mesh OTA). Пусто = канал не создаётся.
    -DSENSOR_CHANNEL_NAME='"sensor_chan"'
    -DSENSOR_CHANNEL_KEY='"sensorPSKbase64==="'
    ; Канал по умолчанию для отправки команд из HA (cmd/send)
    -DTX_CHANNEL='"#connections"'