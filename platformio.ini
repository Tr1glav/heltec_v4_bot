; ============================================================================
; MeshCore listener bot — multi-board build
;
; Envs:
;   heltec_v4_3                Heltec WiFi LoRa 32 V4.3 (SH1106 OLED + FEM)
;   heltec_v4_3_ssd1306        same hardware, Adafruit SSD1306 driver instead
;                              of the built-in SH1106 driver (OLED_DRIVER_SH1106=0)
;   generic_sx1262             any ESP32-S3 + SX1262, serial-only (no OLED/FEM)
;
; All per-board settings live in build_flags below; src/board_config.h maps
; them onto the app-level macros used by src/main.cpp.
; ============================================================================

[platformio]
default_envs = heltec_v4_3

[common]
platform = platformio/espressif32@6.11.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts = pre:scripts/gen_build_time.py
lib_deps =
    SPI
    Wire
    https://github.com/jgromes/RadioLib.git#6d8934836678d8894e3d556550475b37dce3e2b6
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.9
    ; MeshCore pulls in rweather/Crypto, which supplies Ed25519.h used for adverts
    https://github.com/meshcore-dev/MeshCore.git

; ---- Radio parameters (identical for every SX1262 board) ----
[radio_params]
build_flags =
    -DLORA_FREQ=868.731018
    -DLORA_BW=62.5
    -DLORA_SF=8
    -DLORA_TX_POWER=10
    -DLORA_SYNC_WORD=0x12
    -DLORA_PREAMBLE=16

; ============================================================================
; Heltec WiFi LoRa 32 V4.3 (custom board def in boards/ + variants/)
; ============================================================================
[heltec_v4_3_base]
platform = ${common.platform}
board = heltec_wifi_lora_32_V4
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
extra_scripts = ${common.extra_scripts}
lib_deps = ${common.lib_deps}
build_flags =
    ${radio_params.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DRADIOLIB_STATIC_ONLY=1
    -DRADIOLIB_GODMODE=1
    -DHAS_OLED=1
    -DHAS_FEM=1

    ; ==== custom variant (see boards/ + variants/) ====
    -I variants/heltec_wifi_lora_32_V4

    ; ==== SX1262 pins ====
    -DP_LORA_NSS=8
    -DP_LORA_DIO_1=14
    -DP_LORA_RESET=12
    -DP_LORA_BUSY=13
    -DP_LORA_SCLK=9
    -DP_LORA_MISO=11
    -DP_LORA_MOSI=10

    ; ==== FEM (KCT8103L external PA on V4.3) ====
    -DP_LORA_PA_POWER=7
    -DP_LORA_KCT8103L_PA_CSD=2
    -DP_LORA_KCT8103L_PA_CTX=5

    ; ==== OLED / I2C / button / power rail ====
    -DPIN_BOARD_SDA=17
    -DPIN_BOARD_SCL=18
    -DPIN_OLED_RESET=21
    -DPIN_USER_BTN=0
    -DPIN_VEXT_EN=36
    -DPIN_VEXT_EN_ACTIVE=LOW

    ; ==== SX1262 config specific to Heltec V4 (RadioLib + app hooks) ====
    -DSX126X_DIO2_AS_RF_SWITCH=true
    -DSX126X_DIO3_TCXO_VOLTAGE=1.8
    -DSX126X_CURRENT_LIMIT=140
    -DSX126X_RX_BOOSTED_GAIN=1
    -DSX126X_REGISTER_PATCH=1

    ; ==== MeshCore build helpers (Radiolib wrappers in lib/) ====
    -DRADIO_CLASS=CustomSX1262
    -DWRAPPER_CLASS=CustomSX1262Wrapper
    -DHELTEC_V4_BOARD
    -I lib

[env:heltec_v4_3]
extends = heltec_v4_3_base

[env:heltec_v4_3_ssd1306]
extends = heltec_v4_3_base
build_flags =
    ${heltec_v4_3_base.build_flags}
    -DOLED_DRIVER_SH1106=0

; ============================================================================
; Example: generic ESP32-S3 + SX1262 devkit, no OLED, no FEM.
; Adjust the P_LORA_* pins to your actual wiring. Serial console only.
; ============================================================================
[env:generic_sx1262]
platform = ${common.platform}
board = esp32-s3-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
extra_scripts = ${common.extra_scripts}
lib_deps = ${common.lib_deps}
build_flags =
    ${radio_params.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DRADIOLIB_STATIC_ONLY=1
    -DRADIOLIB_GODMODE=1
    -DHAS_OLED=0
    -DHAS_FEM=0

    ; ==== MeshCore build helpers (Radiolib wrappers + ed25519 in lib/) ====
    -I lib

    ; ==== example SX1262 wiring on a devkit: change to match your board ====
    -DP_LORA_NSS=10
    -DP_LORA_DIO_1=2
    -DP_LORA_RESET=4
    -DP_LORA_BUSY=3
    -DP_LORA_SCLK=8
    -DP_LORA_MISO=6
    -DP_LORA_MOSI=7