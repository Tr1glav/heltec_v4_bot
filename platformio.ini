; ============================================================================
; MeshCore listener bot — multi-board build
;
; Envs:
;   heltec_v4_3                Heltec WiFi LoRa 32 V4.3 (SH1106 OLED + FEM)
;   heltec_v4_3_ssd1306        same hardware, Adafruit SSD1306 driver instead
;                              of the built-in SH1106 driver (OLED_DRIVER_SH1106=0)
;   generic_sx1262             any ESP32-S3 + SX1262, serial-only (no OLED/FEM)
;
; All per-board settings live in build_flags below; src/board_config.h maps
; them onto the app-level macros used by src/main.cpp.
; ============================================================================

[platformio]
default_envs = heltec_v3_coordinator, heltec_v4_3_sensors

[common]
platform = platformio/espressif32@6.11.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts = 
    pre:scripts/gen_web.py
    pre:scripts/gen_version.py
    post:scripts/copy_firmware.py
lib_deps =
    SPI
    Wire
    https://github.com/jgromes/RadioLib.git#6d8934836678d8894e3d556550475b37dce3e2b6
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.9
    ; Ed25519.h для подписи adverts. Раньше приходил транзитивно из MeshCore, но та тянула
    ; и компилировала BLE, RTClib, CayenneLPP и ещё ~70 файлов, которые проекту не нужны
    rweather/Crypto@^0.4.0
    ; MQTT (optional, enabled via -DMQTT_ENABLED)
    https://github.com/knolleary/pubsubclient.git

; ---- MQTT / Home Assistant (optional) ----
; Раскомментируйте флаги в [mqtt] и добавьте
;   extra_flags = ${mqtt.build_flags}
; в нужный env для включения MQTT.
[mqtt]
build_flags =
    -DMQTT_ENABLED
    ; Внутренний датчик температуры S3 у многих модулей не откалиброван
    ; (показывает ~50-60°C на холодной плате). Чтобы привести к реальной:
    ;   -DTEMP_SENSOR_OFFSET=35

; ============================================================================
; Heltec WiFi LoRa 32 V4.3 (custom board def in boards/ + variants/)
; ============================================================================
[heltec_v4_3_base]
platform = ${common.platform}
board = heltec_wifi_lora_32_V4
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
extra_scripts = ${common.extra_scripts}
lib_deps = ${common.lib_deps}
build_flags =
    ;${mqtt.build_flags}       ; <-- раскомментируйте для MQTT + Home Assistant
    -DFW_ENV='"$PIOENV"'
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DRADIOLIB_STATIC_ONLY=1
    -DRADIOLIB_GODMODE=1
    -DHAS_OLED=1
    -DHAS_FEM=1

    ; ==== custom variant (see boards/ + variants/) ====
    -I variants/heltec_wifi_lora_32_V4

    ; ==== SX1262 pins ====
    -DP_LORA_NSS=8
    -DP_LORA_DIO_1=14
    -DP_LORA_RESET=12
    -DP_LORA_BUSY=13
    -DP_LORA_SCLK=9
    -DP_LORA_MISO=11
    -DP_LORA_MOSI=10

    ; ==== FEM (KCT8103L external PA on V4.3) ====
    -DP_LORA_PA_POWER=7
    -DP_LORA_KCT8103L_PA_CSD=2
    -DP_LORA_KCT8103L_PA_CTX=5

    ; ==== OLED / I2C / button / power rail ====
    -DPIN_BOARD_SDA=17
    -DPIN_BOARD_SCL=18
    -DPIN_OLED_RESET=21
    -DPIN_USER_BTN=0
    -DPIN_VEXT_EN=36
    -DPIN_VEXT_EN_ACTIVE=LOW

    ; ==== короткий код платы для hello/MQTT ====
    -DBOARD_CODE='"h43"'
    ; Мощность передатчика по умолчанию, дБм (предел SX1262 — 22). Настройка lora_tx
    ; в NVS её перекрывает; это значение — для свежей, ещё не настроенной платы.
    -DLORA_TX_POWER=22

    ; ==== батарея: делитель VBAT на ADC1_CH0, включается ADC_CTRL (на V4 — HIGH) ====
    -DPIN_VBAT_READ=1
    -DPIN_VBAT_CTRL=37
    -DPIN_VBAT_CTRL_ACTIVE=HIGH

    ; ==== SX1262 config specific to Heltec V4 (RadioLib + app hooks) ====
    -DSX126X_DIO2_AS_RF_SWITCH=true
    -DSX126X_DIO3_TCXO_VOLTAGE=1.8
    -DSX126X_CURRENT_LIMIT=140
    -DSX126X_RX_BOOSTED_GAIN=1
    -DSX126X_REGISTER_PATCH=1

    ; ==== MeshCore build helpers (Radiolib wrappers in lib/) ====
    -DRADIO_CLASS=CustomSX1262
    -DWRAPPER_CLASS=CustomSX1262Wrapper
    -DHELTEC_V4_BOARD
    -I lib

[env:heltec_v4_3]
extends = heltec_v4_3_base

[env:heltec_v4_3_coordinator]
extends = heltec_v4_3_base
build_flags =
    ${heltec_v4_3_base.build_flags}
    ${mqtt.build_flags}

[env:heltec_v4_3_ssd1306]
extends = heltec_v4_3_base
build_flags =
    ${heltec_v4_3_base.build_flags}
    -DOLED_DRIVER_SH1106=0

; ============================================================================
; Heltec WiFi LoRa 32 V4.3 SENSOR BOARD
; ============================================================================
; Компаньон: тот же сенсорный узел плюс BLE-протокол телефонного приложения MeshCore.
; SENSOR_NODE здесь намеренно тоже определён — hello, пинг по тройному нажатию и
; прошивка по LoRa должны работать ровно как на сенсоре, без правок в их коде.
[env:heltec_v4_3_companion]
extends = heltec_v4_3_base
build_flags =
    ${heltec_v4_3_base.build_flags}
    -DSENSOR_NODE=1
    -DCOMPANION_NODE=1

[env:heltec_v4_3_sensors]
extends = heltec_v4_3_base
build_flags =
    ${heltec_v4_3_base.build_flags}
    -DSENSOR_NODE=1
    ; Сенсорная плата не подключается к WiFi/MQTT — только mesh-радио.
    ; Имя узла и канал сенсоров задаются в консоли устройства и живут в NVS.

; ============================================================================
; Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262, встроенный RF-переключатель на
; DIO2, без внешнего FEM). OLED SSD1306, питание периферии GPIO36 (HIGH).
; Конфигурация взята из платного variant'а heltec_wifi_lora_32_V3 (PlatformIO).
; ============================================================================
[heltec_v3_base]
platform = ${common.platform}
board = heltec_wifi_lora_32_V3
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
extra_scripts = ${common.extra_scripts}
lib_deps = ${common.lib_deps}
; Startup "ESP-ROM:esp32s3-..." spam comes from the ROM bootloader printed to the
; native USB (USB-Serial/JTAG) BEFORE any firmware runs — software cannot suppress it.
; Optional one-way fix (burn efuse, irreversible!):
;   espefuse.py -p /dev/ttyACM0 burn_efuse DIS_USB_SERIAL_JTAG_ROM_PRINT 1
build_flags =
    ; ${mqtt.build_flags}       ; <-- раскомментируйте для MQTT + Home Assistant
    -DFW_ENV='"$PIOENV"'
    -DARDUINO_USB_MODE=1
    ; На V3 USB-C заведён только на мост CP2102, нативный USB чипа никуда не подключён.
    ; С CDC_ON_BOOT=1 консоль ушла бы в несуществующий порт, поэтому Serial = UART0.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
    -DRADIOLIB_STATIC_ONLY=1
    -DRADIOLIB_GODMODE=1
    -DHAS_OLED=1
    -DOLED_DRIVER_SH1106=0
    -DHAS_FEM=0

    ; ==== SX1262 pins (V3: NSS8 SCLK9 MISO11 MOSI10 RST12 BUSY13 DIO1=14) ====
    -DP_LORA_NSS=8
    -DP_LORA_DIO_1=14
    -DP_LORA_RESET=12
    -DP_LORA_BUSY=13
    -DP_LORA_SCLK=9
    -DP_LORA_MISO=11
    -DP_LORA_MOSI=10

    ; ==== OLED / I2C / button / power rail ====
    -DPIN_BOARD_SDA=17
    -DPIN_BOARD_SCL=18
    -DPIN_OLED_RESET=21
    -DPIN_USER_BTN=0
    -DPIN_VEXT_EN=36
    ; Проверено на плате: питание периферии включается НИЗКИМ уровнем. При высоком
    ; экран питается паразитно — работает, но заметно тусклее и странно реагирует на
    ; запись регистров. У V4.3 здесь тоже LOW, и её экран всегда был ярким.
    -DPIN_VEXT_EN_ACTIVE=LOW

    ; ==== короткий код платы для hello/MQTT ====
    -DBOARD_CODE='"h3"'
    -DLORA_TX_POWER=20   ; мощность передатчика по умолчанию, дБм

    ; ==== батарея: делитель VBAT на ADC1_CH0, включается ADC_CTRL (на V3 — LOW) ====
    -DPIN_VBAT_READ=1
    -DPIN_VBAT_CTRL=37
    -DPIN_VBAT_CTRL_ACTIVE=LOW

    ; ==== SX1262 config (RF switch внутри чипа на DIO2, внешнего FEM НЕТ) ====
    -DSX126X_DIO2_AS_RF_SWITCH=true
    -DSX126X_DIO3_TCXO_VOLTAGE=1.8
    -DSX126X_CURRENT_LIMIT=140
    -DSX126X_RX_BOOSTED_GAIN=1
    ; ВНИМАНИЕ: НЕ ставим -DSX126X_REGISTER_PATCH=1 (это патч именно для V4)

    ; ==== MeshCore build helpers (GenericSX1262Board, без FEM) ====
    -DRADIO_CLASS=CustomSX1262
    -DWRAPPER_CLASS=CustomSX1262Wrapper
    -I lib

[env:heltec_v3]
extends = heltec_v3_base

[env:heltec_v3_coordinator]
extends = heltec_v3_base
build_flags =
    ${heltec_v3_base.build_flags}
    ${mqtt.build_flags}

[env:heltec_v3_sensors]
extends = heltec_v3_base
build_flags =
    ${heltec_v3_base.build_flags}
    -DSENSOR_NODE=1
    ; Сенсорная плата не подключается к WiFi/MQTT — только mesh-радио.
    ; Имя узла и канал сенсоров задаются в консоли устройства и живут в NVS.

; ============================================================================
; Example: generic ESP32-S3 + SX1262 devkit, no OLED, no FEM.
; Adjust the P_LORA_* pins to your actual wiring. Serial console only.
; ============================================================================
[env:generic_sx1262]
platform = ${common.platform}
board = esp32-s3-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
extra_scripts = ${common.extra_scripts}
lib_deps = ${common.lib_deps}
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DRADIOLIB_STATIC_ONLY=1
    -DRADIOLIB_GODMODE=1
    -DHAS_OLED=0
    -DHAS_FEM=0

    ; ==== MeshCore build helpers (Radiolib wrappers + ed25519 in lib/) ====
    -I lib
    -DBOARD_CODE='"gen"'

    ; ==== example SX1262 wiring on a devkit: change to match your board ====
    -DP_LORA_NSS=10
    -DP_LORA_DIO_1=2
    -DP_LORA_RESET=4
    -DP_LORA_BUSY=3
    -DP_LORA_SCLK=8
    -DP_LORA_MISO=6
    -DP_LORA_MOSI=7